<!DOCTYPE html>
<html>
<head>
    <title>Product Table</title>
</head>
<body>

<table border="1" cellspacing="0" cellpadding="10">
    <tr>
        <th>Category</th>
        <th>Brand</th>
        <th colspan="2">Product Details</th>
    </tr>

    <tr>
        <td rowspan="4">Laptop</td>
        <td rowspan="2">Dell</td>
        <td>i.</td>
        <td>8GB RAM</td>
    </tr>

    <tr>
        <td>ii.</td>
        <td>512GB SSD</td>
    </tr>

    <tr>
        <td rowspan="2">HP</td>
        <td>e)</td>
        <td>16GB RAM</td>
    </tr>

    <tr>
        <td>f)</td>
        <td>1TB SSD</td>
    </tr>

    <tr>
        <td>Mobile</td>
        <td>Samsung</td>
        <td colspan="2">6GB RAM</td>
    </tr>

    <tr>
        <td>Accessories</td>
        <td colspan="3">Mouse, Keyboard</td>
    </tr>

</table>

</body>
</html>
